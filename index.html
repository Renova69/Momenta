<!doctype html>

    <!--
      No maximum-scale or user-scalable=no. Blocking pinch-zoom is a WCAG 1.4.4
      failure, and this app is read on a phone, one-handed, in a dark room: the
      guest who most needs to zoom into a face is the one it was blocking.
      Double-tap zoom is what the setting was really there to stop, and iOS has
      not needed that since 10.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121214" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>WedMoments — Сватбен албум и споделяне на снимки на живо</title>

  </head>
